name: Import Winlator runtime and build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this standalone repository
        uses: actions/checkout@v4
        with:
          path: project
          token: ${{ github.token }}
          persist-credentials: true
      - name: Checkout Winlator-CMOD runtime source
        uses: actions/checkout@v4
        with:
          repository: mdarman0964/Winlator-CMOD
          ref: mt5-optimization
          path: upstream
          fetch-depth: 1
      - name: Import complete runtime source into this repository
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          # Keep this repository's workflows, but replace the scaffold app with the actual runtime source.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' ../upstream/ ./
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="CMOD"/android:label="MT5 Android Emulator"/' app/src/main/AndroidManifest.xml
          fi
          if [ -f app/build.gradle ]; then
            sed -i 's/versionName "7.1.4x-cmod"/versionName "7.1.4x-mt5"/' app/build.gradle
          fi
          cat > README.md <<'EOF'
          # MT5 Android Emulator

          This repository now contains the Winlator-CMOD runtime source, maintained as a separate project, with the application label changed to **MT5 Android Emulator**.

          ## Included runtime foundations
          - Wine-based Windows compatibility environment and Box64/ARM64 execution support from the upstream Winlator-CMOD source
          - Container management and per-container Wine prefix (virtual Windows C: drive)
          - Existing XServer/graphics display and input-control infrastructure
          - Optional background keep-alive service from the source branch
          - Galaxy M53 5G setup and testing notes in MT5_GALAXY_M53.md

          ## Build
          Open **Actions → Import Winlator runtime and build** for the initial import/build. Later builds run through **Actions → Build Android APK**.

          The first runtime build downloads ImageFS/Proton assets and may take a while or use several GB of network/storage. GitHub Actions stores the resulting debug APK as an artifact.

          ## MT5 installation
          Download the official Windows installer from https://www.metatrader.com/en/download/desktop, then use the app's container/file manager to run mt5setup.exe inside a configured container. MT5 compatibility and screen-off behavior must be tested on the actual device before relying on it.

          ## License and attribution
          This project retains the upstream LICENSE and source notices. It is based on https://github.com/mdarman0964/Winlator-CMOD and its upstream Winlator project. Check each bundled component's license before redistribution.
          EOF
          git fetch origin main
          git checkout origin/main -- .github/workflows/build-android.yml .github/workflows/import-runtime.yml
          git reset --mixed origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Runtime source is already up to date; no source commit is needed."
          else
            git commit -m "Import Winlator-CMOD runtime for standalone MT5 project"
            git push origin HEAD:main
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Build full runtime APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: MT5-Android-Emulator-runtime-debug-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
